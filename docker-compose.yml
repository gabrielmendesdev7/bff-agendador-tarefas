services:

  # ==========================================
  # KAFKA
  # ==========================================
  kafka:
    image: apache/kafka:4.0.1
    container_name: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    networks:
      - backend-network

  # ==========================================
  # RABBITMQ
  # ==========================================
  rabbitmq:
    image: rabbitmq:4.3.1-management-alpine

    container_name: rabbitmq

    restart: unless-stopped

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    networks:
      - backend-network

  # ==========================================
  # MONGODB
  # ==========================================
  mongo:
    image: mongo:7
    container_name: mongo

    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_DATABASE: db_agendador

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"

      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

    networks:
      - backend-network

  # ==========================================
  # POSTGRESQL
  # ==========================================
  postgres:
    image: postgres:17
    container_name: postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: db_usuario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U postgres -d db_usuario"

      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - backend-network

  # ==========================================
  # MICROSERVIÇO AGENDADOR DE TAREFAS
  # ==========================================
  agendador-tarefas:
    build:
      context: ../agendador-tarefas
      dockerfile: Dockerfile
      target: runtime

    container_name: agendador-tarefas

    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      SERVER_PORT: 8081

      # Spring Boot 3.x
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/db_agendador

      # Spring Boot 4.x
      SPRING_MONGODB_URI: mongodb://mongo:27017/db_agendador

      USUARIO_URL: http://usuario:8080

    depends_on:
      mongo:
        condition: service_healthy
      usuario:
        condition: service_started

    networks:
      - backend-network

  # ==========================================
  # MICROSERVIÇO USUÁRIO
  # ==========================================
  usuario:
    build:
      context: ../usuario
      dockerfile: Dockerfile
      target: runtime

    container_name: usuario

    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SERVER_PORT: 8080

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_usuario
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend-network

    # ==========================================
  # MICROSERVIÇO NOTIFICAÇÃO
  # ==========================================
  notificacao:
    build:
      context: ../notificacao
      dockerfile: Dockerfile

    container_name: notificacao

    restart: unless-stopped

    ports:
      - "8084:8084"

    environment:
      SERVER_PORT: 8084

      # RabbitMQ
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      # E-mail
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}

    depends_on:
      rabbitmq:
        condition: service_healthy

      kafka:
        condition: service_started

    networks:
      - backend-network

  # ==========================================
  # BFF AGENDADOR DE TAREFAS
  # ==========================================
  bff-agendador-tarefas:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: bff-agendador-tarefas

    restart: unless-stopped

    ports:
      - "8083:8083"

    environment:
      SERVER_PORT: 8083

      # Comunicação entre microsserviços
      USUARIO_URL: http://usuario:8080/usuario
      AGENDADOR_TAREFAS_URL: http://agendador-tarefas:8081/tarefas
      NOTIFICACAO_URL: http://notificacao:8084/email

      # RabbitMQ
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

    depends_on:
      usuario:
        condition: service_started

      agendador-tarefas:
        condition: service_started

      notificacao:
        condition: service_started

      rabbitmq:
        condition: service_healthy

    networks:
      - backend-network

# ==========================================
# VOLUMES
# ==========================================
volumes:
  mongo_data:
  postgres_data:
  rabbitmq_data:

# ==========================================
# NETWORKS
# ==========================================
networks:
  backend-network:
    driver: bridge